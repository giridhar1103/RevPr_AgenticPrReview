name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check revpr evals tests --select E9,F,B
      - name: Unit and retrieval regression tests
        env:
          REVPR_DATA: ${{ runner.temp }}/revpr
        run: pytest -q
